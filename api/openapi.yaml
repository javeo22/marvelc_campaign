openapi: 3.1.0
info:
  title: Core Protocol Companion API
  version: 1.0.0
  description: >-
    Optional server boundary for MarvelCDB metadata and cloud synchronization.
    The local-first campaign engine must remain playable without this API.
    This contract never proxies, downloads, stores, or exports official card-image binaries.
servers:
  - url: /api
tags:
  - name: Health
  - name: Cards
  - name: Decklists
  - name: Sync
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                required: [ok, version]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  cardImagesEnabled: { type: boolean }
  /cards/search:
    get:
      tags: [Cards]
      operationId: searchCards
      description: Search normalized metadata from a cached MarvelCDB corpus with local bilingual fallback.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: locale
          schema: { type: string, enum: [en, es], default: en }
        - in: query
          name: pack
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Matching card summaries
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [items, source, stale]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CardSummary' }
                  source: { type: string, enum: [marvelcdb, local-fallback, mixed] }
                  stale: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /cards/{code}:
    get:
      tags: [Cards]
      operationId: getCard
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string, pattern: '^[0-9]{5}[a-z]?$' }
        - in: query
          name: locale
          schema: { type: string, enum: [en, es], default: en }
      responses:
        '200':
          description: One normalized card record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardDetail' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /decklists/{id}:
    get:
      tags: [Decklists]
      operationId: getPublicDecklist
      description: Optional pass-through normalization for a public MarvelCDB decklist. Disabled in the first MVP if not needed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Public decklist metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /sync/push:
    post:
      tags: [Sync]
      operationId: pushSaveEvents
      description: Optional authenticated cloud-sync endpoint. The guest/local build must not call it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPush' }
      responses:
        '200':
          description: Accepted event range and canonical sequence
          content:
            application/json:
              schema:
                type: object
                required: [saveId, acceptedThroughSequence, serverUpdatedAt]
                properties:
                  saveId: { type: string, format: uuid }
                  acceptedThroughSequence: { type: integer }
                  serverUpdatedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /sync/pull:
    get:
      tags: [Sync]
      operationId: pullSaveEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: saveId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: afterSequence
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Canonical events after the supplied sequence
          content:
            application/json:
              schema:
                type: object
                required: [saveId, events, latestSequence]
                properties:
                  saveId: { type: string, format: uuid }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/CampaignEvent' }
                  latestSequence: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: RFC 9457-style problem response
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ExternalImage:
      type: object
      required: [mode, externalUrl, mayCache]
      properties:
        mode: { type: string, enum: [off, remote] }
        externalUrl: { type: [string, 'null'], format: uri }
        mayCache: { type: boolean, const: false }
        attribution: { type: [string, 'null'] }
        unavailableReason: { type: [string, 'null'] }
    CardSummary:
      type: object
      required: [code, name, nameEn, nameEs, pack, collectorNumber, category, image]
      properties:
        code: { type: string }
        name: { type: string }
        nameEn: { type: [string, 'null'] }
        nameEs: { type: [string, 'null'] }
        pack: { type: string }
        collectorNumber: { type: string }
        category: { type: [string, 'null'] }
        setName: { type: [string, 'null'] }
        image: { $ref: '#/components/schemas/ExternalImage' }
    CardDetail:
      allOf:
        - $ref: '#/components/schemas/CardSummary'
        - type: object
          properties:
            typeCode: { type: [string, 'null'] }
            factionCode: { type: [string, 'null'] }
            traits: { type: [string, 'null'] }
            rulesText: { type: [string, 'null'], description: Copyrighted source text; never bundle wholesale in static application data. }
            faqUrl: { type: [string, 'null'], format: uri }
            sourceUrl: { type: [string, 'null'], format: uri }
            rawSourceUpdatedAt: { type: [string, 'null'] }
    CampaignEvent:
      type: object
      required: [eventId, sequence, type, occurredAt, payload]
      properties:
        eventId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        payload: { type: object }
        deviceId: { type: string }
        clientMutationId: { type: string }
    SyncPush:
      type: object
      required: [saveId, campaignId, definitionVersion, baseSequence, events]
      properties:
        saveId: { type: string, format: uuid }
        campaignId: { type: string, const: core-protocol }
        definitionVersion: { type: string }
        baseSequence: { type: integer, minimum: 0 }
        events:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/CampaignEvent' }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
